version: 0.4
name: memtier_benchmark-multiple-hll-pfmerge-100B-values
description: Runs memtier_benchmark, pre-loading multiple HyperLogLog keys with 100B sized random elements using PFADD, then testing PFMERGE performance by merging these pre-loaded HLLs.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 10
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '"--data-size" "100" --command "PFADD __key__ __data__" --command-key-pattern="P" --key-minimum=1 --key-maximum 10 -n 10000 -c 1 -t 1 --hide-histogram'
  resources:
    requests:
      memory: 2g
tested-groups:
- hyperloglog
tested-commands:
- pfmerge
redis-topologies:
- oss-standalone
build-variants:
- gcc:8.5.0-amd64-debian-buster-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --test-time 180 --command "PFMERGE merged 1 2 3 4 5" --command "PFMERGE merged 6 7 8 9 10" -c 50 -t 4 --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 2g

priority: 62
