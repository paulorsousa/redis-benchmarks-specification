version: 0.4
name: memtier_benchmark-1key-10B-bits-bitmap-setbit
description: Runs memtier_benchmark, for a single key with 10B bits focusing on SETBIT
  performance. The benchmark performs random SETBIT operations on the key for 60 seconds.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 1
  init_commands:
  - '"SETBIT" "bitmap_key" "10000000000" "1"'
  resources:
    requests:
      cpus: '2'
      memory: 4g
  dataset_name: 1key-bitmap-10Bbits-setbit
  dataset_description: This dataset contains 1 bitmap key with a size of 10B bits,
    and random SETBIT operations are performed for 60 seconds.
tested-commands:
- setbit
tested-groups:
- bitmap
redis-topologies:
- oss-standalone
build-variants:
- gcc:15.2.0-amd64-debian-bookworm-default
- gcc:15.2.0-arm64-debian-bookworm-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --command "SETBIT bitmap_key __key__ 1" --key-maximum 10000000000 --key-minimum
    1 --key-prefix "" --command-key-pattern R --distinct-client-seed --test-time 60
    --hide-histogram -c 50 -t 4 --pipeline 50
  resources:
    requests:
      cpus: '4'
      memory: 8g
priority: 19
