version: 0.4
name: memtier_benchmark-20-hll-pfmerge-100B-values
description: Runs memtier_benchmark, pre-loading 20 HyperLogLog keys with 100B sized random elements using PFADD, then testing PFMERGE performance by merging larger sets of these pre-loaded HLLs.
dbconfig:
  configuration-parameters:
    save: '""'
  check:
    keyspacelen: 20
  preload_tool:
    run_image: redislabs/memtier_benchmark:edge
    tool: memtier_benchmark
    arguments: '"--data-size" "100" --command "PFADD hll:__key__ __data__" --command-key-pattern="P" --key-minimum=1 --key-maximum 20 -n 10000 -c 50 -t 4 --hide-histogram'
  resources:
    requests:
      memory: 4g
tested-groups:
- hyperloglog
tested-commands:
- pfmerge
redis-topologies:
- oss-standalone
build-variants:
- gcc:8.5.0-amd64-debian-buster-default
- dockerhub
clientconfig:
  run_image: redislabs/memtier_benchmark:edge
  tool: memtier_benchmark
  arguments: --test-time 180 --command "PFMERGE hll:merged hll:1 hll:2 hll:3 hll:4 hll:5 hll:6 hll:7 hll:8 hll:9 hll:10" --command "PFMERGE hll:merged2 hll:11 hll:12 hll:13 hll:14 hll:15 hll:16 hll:17 hll:18 hll:19 hll:20" -c 50 -t 4 --hide-histogram
  resources:
    requests:
      cpus: '4'
      memory: 2g

priority: 64
